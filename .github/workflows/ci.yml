name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'  # weekly: the jobs and the image install the latest chezmoi (and the image and the macOS job the latest sheldon, starship, zoxide)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install zsh
        # shellcheck, actionlint and zizmor come from uv.lock, so `make lint` runs the versions a developer machine runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep zsh
      - name: Install chezmoi
        # The template tests need it and fail rather than skip on CI without it. Latest, like the macOS job and the
        # image: a version pinned here is one Dependabot cannot bump.
        run: |
          installer=$(mktemp)
          curl -fsSL --proto '=https' -o "$installer" https://get.chezmoi.io
          sudo sh "$installer" -b /usr/local/bin
          rm "$installer"
      - run: make lint unit
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: make integration

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: brew install bash chezmoi ripgrep sheldon starship zoxide
      - run: make unit integration-native
        env:
          CHROMIUM_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

  ci:
    if: always()
    needs: [checks, integration, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ $result == success ]] || { echo "job results: $RESULTS"; exit 1; }
          done
