name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'  # weekly: the image and the macOS job install the latest chezmoi, sheldon, starship, zoxide
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install zsh, shellcheck and actionlint
        # Both linters are pinned to the versions Homebrew ships locally, so `make lint` reports the
        # same findings here and on a developer machine; the image's own shellcheck is older.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | sudo tar -xJ -f - --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | sudo bash -s -- 1.7.12 /usr/local/bin
      - run: make lint unit
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: make integration

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: brew install chezmoi sheldon starship zoxide
      - run: make unit integration-native
        env:
          CHROMIUM_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

  ci:
    if: always()
    needs: [checks, integration, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ $result == success ]] || { echo "job results: $RESULTS"; exit 1; }
          done
