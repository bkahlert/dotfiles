# Files without a test, each with its reason. A "legacy" entry goes when the file's behaviour is
# next changed: that change adds the test and removes the line. tests/test_conventions.py fails on
# a missing entry, a stale entry and an empty reason.

[bin]

[claude]

[functions]

[chezmoiscripts]
install-nanorc = "one `git clone` behind two guards; the container leg applies it for real"
setup-mcp-servers = "a list of `claude mcp` calls with no branching; the next change that adds a condition adds the test"
sheldon-lock = "renders to one guarded `sheldon lock`; every integration leg renders and runs it"

[modify]

[templates]

[startup]

[conf_d]
90-scratch = "scratch space: its drafts are deliberately untested; the workflow is tested in tests/zsh/test_scratch_workflow.py, the syntax by make lint"
